name: Generate database types

# When a pull request changes migration files, rebuild the schema in a temporary
# database, regenerate src/notes/database.types.ts from it, and commit the result
# to the pull request branch. Developers never edit database.types.ts by hand.

on:
  pull_request:
    paths:
      - "supabase/migrations/**"

# One run per branch at a time; a newer push cancels an older run
concurrency:
  group: db-types-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    # Only for branches in this repository. Pull requests from forks cannot be pushed to.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          # No custom token: the built-in GITHUB_TOKEN pushes the commit (see
          # `permissions` above). Commits pushed this way do not start other workflows,
          # so re-run the checks after the types commit appears (close and reopen the PR,
          # or push an empty commit). To change that, add a personal access token here
          # as `token: ${{ secrets.TYPES_BOT_TOKEN }}`.

      - name: Install the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      # Starts a temporary database and applies every migration in order
      - name: Start a temporary Supabase
        run: supabase start

      # The CLI prints its own messages (Target, update notices) to stderr, so only
      # the TypeScript lands in the file. The raw output is committed unchanged, which
      # keeps CI and `npm run db:types` byte-for-byte identical.
      - name: Generate types from the migrated schema
        run: supabase gen types --schema public > src/notes/database.types.ts

      - name: Stop the temporary Supabase
        if: always()
        run: supabase stop --no-backup

      # Sanity check: the file must be generated TypeScript, not an error message.
      # The CLI starts its output with a blank line, so the first NON-EMPTY line is checked.
      - name: Check the generated file
        run: |
          echo "---- first 6 lines ----"
          head -n 6 src/notes/database.types.ts
          first_line="$(grep -m1 -v '^[[:space:]]*$' src/notes/database.types.ts || true)"
          if [[ "$first_line" != "export type Json"* ]]; then
            echo "::error::Generated file does not start with 'export type Json'. See the lines printed above."
            exit 1
          fi
          echo "Generated file looks valid"

      - name: Commit the types if they changed
        run: |
          if git diff --quiet -- src/notes/database.types.ts; then
            echo "Database types are already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/notes/database.types.ts
          git commit -m "chore: regenerate database types"
          git push