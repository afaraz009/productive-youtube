name: Extension CI

# Type-checks and builds the Chrome extension on every pull request and on pushes
# to the deploy branch. Separate from the Supabase workflow, because that one only
# runs when migration files change.

on:
  pull_request:
  push:
    branches: [notes-integration]
  workflow_dispatch:

# Cancel an older run of the same branch when a new commit is pushed
concurrency:
  group: extension-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # Placeholder values so the build does not need real credentials.
    # The anon key is public by design, but CI doesn't need it, and a CI build
    # is only a check, never something we publish.
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Installs exactly what package-lock.json says. Requires the lockfile to be committed.
      - name: Install dependencies
        run: npm ci

      # Full TypeScript check (Vite alone only strips types, it does not check them).
      
      - name: Type-check
      #if you want to complete the build job despite type errors
        continue-on-error: true
        run: npm run typecheck

      - name: Build the extension
        run: npm run build

      # Chrome loads these files as classic scripts, so they must not contain
      # ES module "import" statements (which appear if Vite creates a shared chunk).
      - name: Verify classic scripts have no ES imports
        run: |
          fail=0
          for f in dist/content_script.js dist/chatgpt_automation.js dist/gemini_automation.js dist/claude_automation.js dist/grok_automation.js; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing $f"
              fail=1
              continue
            fi
            if grep -nE "^[[:space:]]*import[[:space:]{\"']" "$f"; then
              echo "::error file=$f::Found an ES module import. Content scripts must be standalone."
              fail=1
            fi
          done
          exit $fail

      - name: Verify the extension output is complete
        run: |
          for f in dist/manifest.json dist/popup.html dist/auth.html dist/background.js dist/content_script.js; do
            test -f "$f" || { echo "::error::Missing $f"; exit 1; }
          done
          echo "dist/ contains all required files"